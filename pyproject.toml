[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wordtally"
version = "0.1.0"
description = "Count words in text files and show the most common ones."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Muhammad Zuhaib Zahid" }]
dependencies = ["click>=8.1"]

[project.scripts]
wordtally = "wordtally.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
addopts = "-q"
