# Publishes a GitHub release and a container image when a version tag (v1.2.3) is pushed.
# It runs every CI check first; if any test fails, nothing is published.
# Run it by hand with a tag to rebuild and restore that release (the recovery drill in RUNBOOK.md).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild and publish again, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only this job may write: it signs the files and creates the release. It installs nothing.
    # Signing runs on public repositories only, so a private repository still gets its release,
    # without the signatures.
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Check the checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: Sign build provenance
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Sign the SBOM to the wheel
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.whl
          sbom-path: dist/sbom.spdx.json
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists: replacing its files (recovery)"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --verify-tag --generate-notes
          fi

  image:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Builds the container image from the checked package and pushes it to GitHub Container Registry
    # (ghcr.io) with the built-in token. This job may write packages only: it cannot change the code
    # or the release, and the image build is the only place that installs anything under a write token.
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Check the checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: Build, try and push the image
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${TAG#v}"
          docker build --pull -t "$image:$version" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$version" .
          docker run --rm "$image:$version" --version
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image:$version"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$image:$version")"
          digest="${digest#*@}"
          echo "Pushed $image@$digest"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Create the image SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.push.outputs.image }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: image-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sbom
          path: image-sbom.spdx.json
          retention-days: 14
          if-no-files-found: error

  sign-image:
    needs: image
    # Signing runs on public repositories only, as for the release files.
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Signs the image: build provenance and its SBOM, stored next to the image in the registry, then
    # pulls the image by digest and checks both. It installs and builds nothing.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ${{ needs.image.outputs.image }}
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-sbom
          path: sbom
      - name: Log in to the registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Sign build provenance for the image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.image.outputs.image }}
          subject-digest: ${{ needs.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Sign the SBOM to the image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.image.outputs.image }}
          subject-digest: ${{ needs.image.outputs.digest }}
          sbom-path: sbom/image-sbom.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Pull the image by digest and check both signatures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          gh attestation verify "oci://$IMAGE@$DIGEST" -R "$GITHUB_REPOSITORY"
          gh attestation verify "oci://$IMAGE@$DIGEST" -R "$GITHUB_REPOSITORY" \
            --predicate-type https://spdx.dev/Document/v2.3
