# Publishes a GitHub release when a version tag (v1.2.3) is pushed.
# It runs every CI check first; if any test fails, nothing is published.
# Run it by hand with a tag to rebuild and restore that release (the recovery drill in RUNBOOK.md).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild and publish again, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only this job may write: it creates the release and signs the files.
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Check the checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: Install the wheel for the SBOM scan
        run: |
          python3 -m venv sbom-env
          sbom-env/bin/python -m pip install dist/*.whl
      - name: Create the SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: sbom-env
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Sign build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Sign the SBOM to the wheel
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.whl
          sbom-path: dist/sbom.spdx.json
      - name: Publish the GitHub release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists: replacing its files (recovery)"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --verify-tag --generate-notes
          fi
